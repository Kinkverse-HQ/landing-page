name: Docker
on:
  pull_request:
    paths: ['Dockerfile', 'docker/**', 'compose.yaml', '.dockerignore', 'src/**', 'public/**', '*.json', '*.ts', 'index.html', '.github/workflows/docker.yml']
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T landing npm run build
      - run: docker build --target production --build-arg VITE_APP_URL=http://app.localhost:8080 -t landing:test .
      - run: |
          docker run -d --name landing-production -p 127.0.0.1:5174:8080 landing:test
          curl --retry 12 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:5174/
      - if: always()
        run: |
          docker compose logs --tail 50
          docker compose down
          docker rm -f landing-production || true
